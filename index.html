<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un pequeño regalo para ti 💌</title>
<!-- Importamos la fuente Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Golden Hills DEMO';
  src: url('GoldenHillsDEMO.woff2') format('woff2'), url('GoldenHillsDEMO.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

:root {
  --paper:#f4ecdf; 
  --paper-dark:#2b1f1d; 
  --ink:#3d2e2b; 
  --muted:#756b69;
  --rose:#d9787e; 
  --wine:#8e4e58; 
  --gold:#d6ae62; 
  --accent:#c87d63;
  --card-bg:#faeedf; 
  --dark-card:#4d3b38; 
  --shadow:0 20px 60px rgba(61,46,43,.15);
  --color-marron: #624f48;
  --color-claro: #f7e7d1;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family: Georgia, "Times New Roman", serif; color:var(--ink);
  background: #1a1412;
  display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden;
}

.mobile-container {
  width: 430px;
  max-width: 100%;
  height: 100vh;
  background-color: var(--color-claro);
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

@media screen and (max-width: 480px) {
  .mobile-container {
    width: 100%;
    height: 100vh;
    box-shadow: none;
  }
}

.mobile-container::-webkit-scrollbar { display: none; }
.mobile-container { -ms-overflow-style: none; scrollbar-width: none; }

button{font:inherit}
section{
  position:relative; 
  width: 100%;
  aspect-ratio: 430 / 765;
  padding:0; 
  display:flex; 
  align-items:center; 
  justify-content:center; 
  overflow:hidden; 
  flex-shrink:0;
  background-color: var(--color-claro);
  margin-top: -1px;
}

.container{width:100%; height:100%; position:relative;}
h1,h2{font-weight:400}
p{line-height:1.7}
.hidden{display:none!important}

/* VISTA 1 */
#envelope {
  background-color: var(--color-claro); 
  width: 100%; 
  aspect-ratio: 430 / 765;
  position: relative; 
  overflow: hidden; 
  flex-shrink: 0;
  margin-top: 0;
}

.capa-fondo {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  object-fit: contain; object-position: center; pointer-events: none;
}

.envelope-img {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  object-fit: contain; object-position: center; pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.envelope-img.inactive { opacity: 0; }
.envelope-img.jump { transform: scale(1.05) translateY(-10px); }

.interactive-prompt-v1 {
  position: absolute; top: 79%; left: 0; width: 100%;
  text-align: center; z-index: 10; display: flex;
  flex-direction: column; align-items: center; justify-content: center; padding: 0 20px;
}

.btn-abrir-carta {
  background-image: url('img/01vineta_abrir_sobre.svg');
  background-size: cover; background-position: center; border: none;
  color: var(--color-marron); font-family: 'Poppins', sans-serif;
  font-weight: 600; font-size: 0.85rem; padding: 12px 36px;
  cursor: pointer; border-radius: 999px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
  transition: transform 0.2s ease;
}
.btn-abrir-carta:hover { transform: translateY(-2px); }

.subtext-abrir-carta {
  font-family: 'Poppins', sans-serif; font-size: 11px; color: #624f48;
  margin-top: 10px; font-weight: 300; opacity: 0.9;
}

@keyframes bounce {
  0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-6px); }
  60% { transform: translateY(-3px); }
}

.flecha-layer {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  object-fit: contain; object-position: center; cursor: pointer;
  z-index: 20; display: none; animation: bounce 1.6s infinite ease-in-out; pointer-events: auto;
}

.envelope-clickable-area {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 60%; height: 35%; cursor: pointer; z-index: 5;
}

/* CAPAS APILADAS GENERALES */
.capa-animada {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  object-fit: contain; object-position: center; pointer-events: none;
  opacity: 0; transform: translateY(20px);
  transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

#vista2.visible .trazos-capa { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
#vista2.visible .textos-capa { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
#vista2.visible .foto-capa { opacity: 1; transform: translateY(0); transition-delay: 0.5s; z-index: 2; }
#vista2.visible .textos-abajo-capa { opacity: 1; transform: translateY(0); transition-delay: 0.7s; }

#vista3.visible .trazos-capa-3 { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
#vista3.visible .texto-capa-3 { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
#vista3.visible .calendario-capa-3 { opacity: 1; transform: translateY(0); transition-delay: 0.5s; z-index: 2; }

#vista4.visible .trazo-capa-4 { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
#vista4.visible .texto-capa-4 { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
#vista4.visible .elementos-capa-4 { opacity: 1; transform: translateY(0); transition-delay: 0.5s; z-index: 2; }

#vista5.visible .trazo-capa-5 { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
#vista5.visible .texto-capa-5 { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
#vista5.visible .carrusel-capa-5 { opacity: 1; transform: translateY(0); transition-delay: 0.5s; z-index: 2; }

#vista6.visible .trazo-capa-6 { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
#vista6.visible .texto-capa-6 { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
#vista6.visible .cuadro1-capa-6 { opacity: 1; transform: translateY(0); transition-delay: 0.5s; z-index: 2; }
#vista6.visible .cuadro2-capa-6 { opacity: 1; transform: translateY(0); transition-delay: 0.7s; z-index: 3; }
#vista6.visible .cuadro3-capa-6 { opacity: 1; transform: translateY(0); transition-delay: 0.9s; z-index: 4; }

#vista7.visible .trazo-capa-7 { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
#vista7.visible .texto-capa-7 { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
#vista7.visible .vales-capa-7 { opacity: 1; transform: translateY(0); transition-delay: 0.5s; z-index: 2; pointer-events: auto; }

#vista8.visible .trazo-capa-8 { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
#vista8.visible .texto-capa-8 { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
#vista8.visible .music-capa-8 { opacity: 1; transform: translateY(0); transition-delay: 0.5s; z-index: 2; pointer-events: auto; }

#vista10.visible .trazo-capa-10 { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
#vista10.visible .texto-capa-10 { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
#vista10.visible .gift-wrapper-v10 { opacity: 1; transform: translateY(0); transition-delay: 0.5s; z-index: 3; pointer-events: auto; }

/* VISTA 12 (CIERRE CON CAPAS SVG) */
#vista12.visible .trazo-capa-12 { opacity: 1; transform: translateY(0); transition-delay: 0.1s; }
#vista12.visible .texto-capa-12 { opacity: 1; transform: translateY(0); transition-delay: 0.3s; }
#vista12.visible .texto2-capa-12 { opacity: 1; transform: translateY(0); transition-delay: 0.5s; z-index: 2; }

/* VISTA 5 (CARRUSEL) */
.carrusel-wrapper-v5 {
  position: absolute; top: 36%; left: 0; width: 100%; height: 60%; 
  display: flex; flex-direction: column; align-items: center; pointer-events: auto;
}
.carousel-container-v5 {
  width: 100%; height: 85%; display: flex; gap: 24px;
  overflow-x: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x; 
  scroll-snap-type: x mandatory; scroll-behavior: smooth;
  padding: 0 calc(50% - 125px); align-items: center; box-sizing: border-box; cursor: grab; user-select: none;
}
.carousel-container-v5:active { cursor: grabbing; }
.carousel-container-v5::-webkit-scrollbar { display: none; }

.card-item-v5 {
  flex: 0 0 250px; height: 380px; scroll-snap-align: center;
  border-radius: 24px; overflow: hidden; position: relative;
  background: #5a4542; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  display: grid; place-items: center; transition: transform 0.3s ease; pointer-events: auto;
}
.card-item-v5 img { pointer-events: none; }

.scroll-indicators-v5 { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; }
.dot-v5 { width: 7px; height: 7px; background-color: rgba(255, 255, 255, 0.4); border-radius: 50%; transition: all 0.3s ease; cursor: pointer; }
.dot-v5.active { width: 22px; background-color: #ffffff; border-radius: 10px; }

/* VISTA 7 (VALES) */
.vales-wrapper-v7 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; }
.vales-wrapper-v7 img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; pointer-events: none; transition: opacity 0.3s ease; }
.vales-wrapper-v7 img.inactive { opacity: 0; }

.vale-item { position: absolute; cursor: pointer; pointer-events: auto; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
.vale-item img { width: 100%; height: 100%; object-fit: contain; }
.vale-item:hover { transform: translateY(-1.5px); }
.vale-item.bounce { animation: miniSaltoSutil 0.35s cubic-bezier(0.16, 1, 0.3, 1); }

@keyframes miniSaltoSutil {
  0% { transform: scale(1) translateY(0); }
  50% { transform: scale(1.008) translateY(-1.5px); }
  100% { transform: scale(1) translateY(0); }
}

/* VISTA 8 (MÚSICA) */
.music-wrapper-v8 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.interactive-player-v8 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.progress-v8 { position: absolute; top: 73.5%; left: 12%; width: 76%; height: 10px; background: rgba(107, 92, 92, 0.25); border-radius: 10px; overflow: hidden; cursor: pointer; pointer-events: auto; }
.progress-v8 i { display: block; width: 0%; height: 100%; background: #dda15f; border-radius: 10px; transition: width 0.1s linear; }
.time-v8 { position: absolute; top: 76.2%; left: 50%; transform: translateX(-50%); font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500; color: #f5e5cf; text-align: center; width: 100%; }
.play-v8 { position: absolute; top: 81.5%; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; border-radius: 50%; border: 0; background: #dda15f; cursor: pointer; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,0.25); transition: transform 0.2s ease; pointer-events: auto; }
.play-v8:hover { transform: translateX(-50%) scale(1.06); }
.icon-play { width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 18px solid white; margin-left: 3px; }
.icon-pause { display: flex; gap: 5px; justify-content: center; align-items: center; }
.icon-pause span { display: block; width: 5px; height: 20px; background: white; border-radius: 3px; }

/* VISTA 9 (PASTEL / PUDÍN) */
.cake-wrapper-v9 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.cake-wrapper-v9 img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; pointer-events: none; transition: opacity 0.3s ease; }
.cake-wrapper-v9 img.inactive { opacity: 0; }
.cake-clickable-area {
  position: absolute; top: 38%; left: 50%; transform: translateX(-50%);
  width: 55%; height: 35%; cursor: pointer; pointer-events: auto; z-index: 10;
}

/* VISTA 10 (REGALO) */
.gift-wrapper-v10 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.gift-wrapper-v10 img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; pointer-events: none; transition: opacity 0.3s ease, transform 0.2s ease; }
.gift-wrapper-v10 img.inactive { opacity: 0; }
.gift-wrapper-v10 img.jump { transform: scale(1.05) translateY(-6px); }

.gift-clickable-area-v10 {
  position: absolute; top: 40%; left: 50%; transform: translateX(-50%);
  width: 55%; height: 35%; cursor: pointer; pointer-events: auto; z-index: 10;
}

/* VISTA 11: EL RECUERDO */
#vista11-recuerdo {
  background-color: var(--color-claro);
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
}

.capa-11cuadro {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 6;
  background-color: #FAF4EE;
  border-radius: 28px;
  padding: 25px 21px;
  text-align: center;
  box-shadow: 0 12px 35px rgba(0,0,0,0.12);
  width: 94.3%;
  max-width: 380px;
  pointer-events: auto;
}

.contenedor-imagen-recuerdo {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  background: #e0e0e0;
}

.contenedor-imagen-recuerdo img {
  width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;
}
.contenedor-imagen-recuerdo:hover img { transform: scale(1.03); }

.overlay-lupa {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.2); display: flex; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;
}
.contenedor-imagen-recuerdo:hover .overlay-lupa { opacity: 1; }
.overlay-lupa span { color: white; font-size: 22px; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 50%; }

.textos-recuerdo h3 {
  font-size: 14px; letter-spacing: 1.5px; margin: 15px 0 2px 0; color: #4a4a4a; font-family: 'Poppins', sans-serif; font-weight: 600;
}
.textos-recuerdo h4 {
  font-size: 14px; letter-spacing: 1.5px; margin: 0 0 10px 0; color: #bfa17c; font-family: 'Poppins', sans-serif; font-weight: 600;
}
.textos-recuerdo p {
  font-size: 12px; color: #666; margin-bottom: 18px; line-height: 1.4; font-family: 'Poppins', sans-serif; font-weight: 300;
}

.btn-descargar-recuerdo {
  background-color: #624f48;
  color: #ffffff; border: none; padding: 12px 26px; border-radius: 999px;
  font-size: 12px; font-family: 'Poppins', sans-serif; font-weight: 500;
  cursor: pointer; transition: background 0.2s ease, transform 0.1s ease;
  box-shadow: 0 4px 10px rgba(98, 79, 72, 0.3);
}
.btn-descargar-recuerdo:hover { background-color: #4f3f39; transform: translateY(-1px); }

/* Modal Zoom */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px;
}
.modal-contenido { position: relative; max-width: 90%; max-height: 90%; }
.modal-contenido img { max-width: 100%; max-height: 85vh; border-radius: 8px; box-shadow: 0 5px 25px rgba(0,0,0,0.5); display: block; margin: 0 auto; }
.cerrar-modal { position: absolute; top: -40px; right: 0; color: white; font-size: 35px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div class="mobile-container" id="webMasterContainer">

  <!-- VISTA 1 -->
  <section id="envelope">
    <div class="container">
      <img src="img/01Fondo.svg" alt="Fondo" class="capa-fondo">
      <img src="img/01Sobre_cerrado.svg" alt="Sobre cerrado" class="envelope-img" id="imgSobreCerrado">
      <img src="img/01Sobre_abierto.svg" alt="Sobre abierto" class="envelope-img inactive" id="imgSobreAbierto">
      
      <div class="interactive-prompt-v1" id="promptContainer">
        <button class="btn-abrir-carta" id="actionBtn">Abre la carta</button>
        <div class="subtext-abrir-carta" id="hintText">Pulsa para descubrir lo que preparé para ti.</div>
      </div>

      <img src="img/01Flecha_abajo.svg" alt="Desliza hacia abajo" class="flecha-layer" id="flechaImg">
      <div class="envelope-clickable-area" id="openClickArea"></div>
    </div>
  </section>

  <main id="content" class="hidden">

    <!-- VISTA 2 -->
    <section id="vista2">
      <div class="container">
        <img src="img/02fondo.svg" alt="Fondo" class="capa-fondo">
        <img src="img/02trazos.svg" alt="Trazos" class="capa-animada trazos-capa">
        <img src="img/02textos.svg" alt="Textos" class="capa-animada textos-capa">
        <img src="img/02Foto.svg" alt="Marco Foto" class="capa-animada foto-capa">
        <img src="img/02textos_abajo.svg" alt="Textos inferiores" class="capa-animada textos-abajo-capa">
      </div>
    </section>

    <!-- VISTA 3 -->
    <section id="vista3">
      <div class="container">
        <img src="img/03fondo.svg" alt="Fondo" class="capa-fondo">
        <img src="img/03trazo.svg" alt="Trazos" class="capa-animada trazos-capa-3">
        <img src="img/03texto.svg" alt="Textos" class="capa-animada texto-capa-3">
        <img src="img/03calendario.svg" alt="Calendario" class="capa-animada calendario-capa-3">
      </div>
    </section>

    <!-- VISTA 4 -->
    <section id="vista4">
      <div class="container">
        <img src="img/04fondo.svg" alt="Fondo" class="capa-fondo">
        <img src="img/04trazo.svg" alt="Trazo" class="capa-animada trazo-capa-4">
        <img src="img/04texto.svg" alt="Texto" class="capa-animada texto-capa-4">
        <img src="img/04elementos.svg" alt="Elementos" class="capa-animada elementos-capa-4">
      </div>
    </section>

    <!-- VISTA 5 -->
    <section id="vista5">
      <div class="container">
        <img src="img/05fondo.svg" alt="Fondo" class="capa-fondo">
        <img src="img/05trazo.svg" alt="Trazo" class="capa-animada trazo-capa-5">
        <img src="img/05texto.svg" alt="Texto" class="capa-animada texto-capa-5">
        
        <div class="capa-animada carrusel-capa-5 carrusel-wrapper-v5">
          <div class="carousel-container-v5" id="carouselV5">
            <figure class="card-item-v5"><img src="img/foto01.png" alt="Foto 01" style="width: 100%; height: 100%; object-fit: cover;"></figure>
            <figure class="card-item-v5"><img src="img/foto02.png" alt="Foto 02" style="width: 100%; height: 100%; object-fit: cover;"></figure>
            <figure class="card-item-v5"><img src="img/foto03.png" alt="Foto 03" style="width: 100%; height: 100%; object-fit: cover;"></figure>
            <figure class="card-item-v5"><img src="img/foto04.png" alt="Foto 04" style="width: 100%; height: 100%; object-fit: cover;"></figure>
            <figure class="card-item-v5"><img src="img/foto05.png" alt="Foto 05" style="width: 100%; height: 100%; object-fit: cover;"></figure>
            <figure class="card-item-v5"><img src="img/foto06.png" alt="Foto 06" style="width: 100%; height: 100%; object-fit: cover;"></figure>
            <figure class="card-item-v5"><img src="img/foto07.png" alt="Foto 07" style="width: 100%; height: 100%; object-fit: cover;"></figure>
            <figure class="card-item-v5"><img src="img/foto08.png" alt="Foto 08" style="width: 100%; height: 100%; object-fit: cover;"></figure>
            <figure class="card-item-v5"><img src="img/foto09.png" alt="Foto 09" style="width: 100%; height: 100%; object-fit: cover;"></figure>
            <figure class="card-item-v5"><img src="img/foto10.png" alt="Foto 10" style="width: 100%; height: 100%; object-fit: cover;"></figure>
          </div>
          <div class="scroll-indicators-v5" id="indicatorsV5">
            <div class="dot-v5 active" data-index="0"></div>
            <div class="dot-v5" data-index="1"></div>
            <div class="dot-v5" data-index="2"></div>
            <div class="dot-v5" data-index="3"></div>
            <div class="dot-v5" data-index="4"></div>
            <div class="dot-v5" data-index="5"></div>
            <div class="dot-v5" data-index="6"></div>
            <div class="dot-v5" data-index="7"></div>
            <div class="dot-v5" data-index="8"></div>
            <div class="dot-v5" data-index="9"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- VISTA 6 -->
    <section id="vista6">
      <div class="container">
        <img src="img/06fondo.svg" alt="Fondo" class="capa-fondo">
        <img src="img/06trazo.svg" alt="Trazo" class="capa-animada trazo-capa-6">
        <img src="img/06texto.svg" alt="Texto" class="capa-animada texto-capa-6">
        <img src="img/06cuadro1.svg" alt="Cuadro 1" class="capa-animada cuadro1-capa-6">
        <img src="img/06cuadro2.svg" alt="Cuadro 2" class="capa-animada cuadro2-capa-6">
        <img src="img/06cuadro3.svg" alt="Cuadro 3" class="capa-animada cuadro3-capa-6">
      </div>
    </section>

    <!-- VISTA 7 -->
    <section id="vista7">
      <div class="container">
        <img src="img/07fondo.svg" alt="Fondo" class="capa-fondo">
        <img src="img/07trazo.svg" alt="Trazo" class="capa-animada trazo-capa-7">
        <img src="img/07texto.svg" alt="Texto" class="capa-animada texto-capa-7">
        
        <div class="capa-animada vales-capa-7 vales-wrapper-v7">
          <div class="vale-item" id="valeBeso" style="top: 26%; left: 0px; width: 100%; height: 10%;">
            <img src="img/07beso1.svg" alt="Beso 1" id="imgBeso1">
            <img src="img/07beso2.svg" alt="Beso 2" id="imgBeso2" class="inactive">

          <div class="vale-item" id="valeCine" style="top: 41%; left: 0px; width: 100%; height: 10%;">
            <img src="img/07cine1.svg" alt="Cine 1" id="imgCine1">
            <img src="img/07cine2.svg" alt="Cine 2" id="imgCine2" class="inactive">

          <div class="vale-item" id="valeComida" style="top: 56%; left: 0px; width: 100%; height: 10%;">

            <img src="img/07comida2.svg" alt="Comida 2" id="imgComida2" class="inactive">

          <div class="vale-item" id="valeAbrazo" style="top: 71%; left: 0px; width: 100%; height: 10%;">
            <img src="img/07abrazo1.svg" alt="Abrazo 1" id="imgAbrazo1">
            <img src="img/07abrazo2.svg" alt="Abrazo 2" id="imgAbrazo2" class="inactive">
          </div>
          <div class="vale-item" id="valeDeseo" style="top: 86%; left: 0px; width: 100%; height: 10%;">
            <img src="img/07deseo1.svg" alt="Deseo 1" id="imgDeseo1">
            <img src="img/07deseo2.svg" alt="Deseo 2" id="imgDeseo2" class="inactive">
          </div>
        </div>
      </div>
    </section>

    <!-- VISTA 8 -->
    <section id="vista8">
      <div class="container">
        <img src="img/08fondo.svg" alt="Fondo" class="capa-fondo">
        <img src="img/08trazo.svg" alt="Trazo" class="capa-animada trazo-capa-8">
        <img src="img/08music.svg" alt="Música" class="capa-animada music-capa-8 music-wrapper-v8">
        <img src="img/08texto.svg" alt="Texto" class="capa-animada music-capa-8 music-wrapper-v8" style="z-index: 3;">
        
        <audio id="audioCancion" src="audio/musica.mp3" preload="auto"></audio>

        <div class="capa-animada music-capa-8 interactive-player-v8" style="z-index: 4;">
          <div class="progress-v8" id="progressBar">
            <i id="progressIndicator"></i>
          </div>
          <div class="time-v8" id="timeIndicator">00:00 · 00:00</div>
          <button class="play-v8" id="playBtn" aria-label="Reproducir o Pausar">
            <div class="icon-play" id="playIcon"></div>

        </div>
      </div>
    </section>

    <!-- VISTA 9 (PASTEL / PUDÍN) -->
    <section id="vista9">
      <div class="container">
        <img src="img/09fondo.svg" alt="Fondo" class="capa-fondo">
        <img src="img/09trazo.svg" alt="Trazo" class="capa-animada" style="opacity: 1; transform: translateY(0);">
        <img src="img/09texto.svg" alt="Texto" class="capa-animada" style="opacity: 1; transform: translateY(0); z-index: 2;">
        
        <div class="cake-wrapper-v9" style="z-index: 3;">
          <img src="img/09pasteloff.svg" alt="Pastel apagado" id="imgPastelOff">
          <img src="img/09pastelon.svg" alt="Pastel encendido" id="imgPastelOn" class="inactive">
        </div>

        <div class="cake-clickable-area" id="cakeToggleArea"></div>
      </div>
    </section>

    <!-- VISTA 10 -->
    <section id="vista10">
      <div class="container">
        <img src="img/10fondo.svg" alt="Fondo" class="capa-fondo">
        <img src="img/10trazo.svg" alt="Trazo" class="capa-animada trazo-capa-10">
        <img src="img/10texto.svg" alt="Texto" class="capa-animada texto-capa-10">
        
        <div class="capa-animada gift-wrapper-v10">
          <img src="img/10regalocerrado.svg" alt="Regalo cerrado" id="foto11">
          <img src="img/10regalobierto.svg" alt="Regalo abierto" id="imgRegaloAbierto" class="inactive">
        </div>

        <div class="gift-clickable-area-v10" id="giftToggleArea"></div>
      </div>
    </section>

    <!-- VISTA 11: BLOQUE RECUERDO -->
    <section id="vista11-recuerdo" class="hidden">
      <div class="container">
        <img src="img/11fondo.svg" alt="Fondo" class="capa-fondo">
        <img src="img/11trazo.svg" alt="Trazo" class="capa-animada" style="opacity: 1; transform: translateY(0);">
        
        <div class="capa-11cuadro">
          <div class="contenedor-imagen-recuerdo" onclick="abrirModalRecuerdo()">
            <img id="imagenRecuerdoSrc" src="img/foto11.png" alt="Un pequeño recuerdo">
            <div class="overlay-lupa"><span>🔍</span></div>
          </div>

          <div class="textos-recuerdo">
            <h3>UN PEQUEÑO RECUERDO</h3>
            <h4>PARA TI.</h4>
            <p>Para que tengas un pedacito de este día guardado contigo.</p>
          </div>

          <button class="btn-descargar-recuerdo" onclick="descargarRecuerdo()">
            Descargar recuerdo
          </button>
        </div>
      </div>
    </section>

    <!-- VISTA 12: CIERRE -->
    <section id="vista12">
      <div class="container">
        <img src="img/12fondo.svg" alt="Fondo" class="capa-fondo">
        <img src="img/12trazo.svg" alt="Trazo" class="capa-animada trazo-capa-12">
        <img src="img/12texto.svg" alt="Texto" class="capa-animada texto-capa-12">
        <img src="img/12texto2.svg" alt="Texto 2" class="capa-animada texto2-capa-12">
      </div>

  </main>
</div>

<!-- Modal -->
<div id="modalImagenCompleta" class="modal-overlay" onclick="cerrarModalRecuerdo(event)">
  <div class="modal-contenido">
    <span class="cerrar-modal" onclick="cerrarModalRecuerdo()">&times;</span>
    <img id="imagenModalZoom" src="" alt="Recuerdo ampliado">
  </div>
</div>

<script>
const imgSobreCerrado = document.getElementById('imgSobreCerrado');
const imgSobreAbierto = document.getElementById('imgSobreAbierto');
const promptContainer = document.getElementById('promptContainer');
const actionBtn = document.getElementById('actionBtn');
const openClickArea = document.getElementById('openClickArea');
const flechaImg = document.getElementById('flechaImg');
const content = document.getElementById('content');
const audio = document.getElementById('audioCancion');
const playIcon = document.getElementById('playIcon');

// Reducir el volumen de la canción en un 25% (queda al 75%)
if (audio) {
  audio.volume = 0.008;
}

function abrirCarta() {
  imgSobreCerrado.classList.add('jump');
  setTimeout(() => {
    imgSobreCerrado.classList.add('inactive');
    imgSobreCerrado.classList.remove('jump');
    imgSobreAbierto.classList.remove('inactive');
    imgSobreAbierto.classList.add('jump');
    setTimeout(() => imgSobreAbierto.classList.remove('jump'), 200);

    promptContainer.style.display = 'none';
    openClickArea.style.display = 'none';
    flechaImg.style.display = 'block';
  }, 150);
}

actionBtn.addEventListener('click', abrirCarta);
openClickArea.addEventListener('click', abrirCarta);

/* Al presionar la flecha: avanza de sección y reproduce la música automáticamente */
flechaImg.addEventListener('click', () => {
  content.classList.remove('hidden');
  const primeraSeccion = content.querySelector('section');
  if (primeraSeccion) primeraSeccion.scrollIntoView({ behavior: 'smooth' });
  observeReveals();

  if (audio) {
    audio.play().then(() => {
      playIcon.className = 'icon-pause';
      playIcon.innerHTML = '<span></span><span></span>';
    }).catch(e => {
      console.log("Reproducción automática bloqueada por el navegador:", e);
    });
  }
});

/* CARRUSEL V5 */
const carouselV5 = document.getElementById('carouselV5');
const dotsV5 = document.querySelectorAll('.dot-v5');
const cardsV5 = document.querySelectorAll('.card-item-v5');

if (carouselV5) {
  let isDown = false;
  let startX;
  let scrollLeft;

  carouselV5.addEventListener('mousedown', (e) => {
    isDown = true;
    carouselV5.style.cursor = 'grabbing';
    startX = e.pageX - carouselV5.offsetLeft;
    scrollLeft = carouselV5.scrollLeft;
  });

  carouselV5.addEventListener('mouseleave', () => { isDown = false; carouselV5.style.cursor = 'grab'; });
  carouselV5.addEventListener('mouseup', () => { isDown = false; carouselV5.style.cursor = 'grab'; });

  carouselV5.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - carouselV5.offsetLeft;
    const walk = (x - startX) * 1.5;
    carouselV5.scrollLeft = scrollLeft - walk;
  });

  carouselV5.addEventListener('scroll', () => {
    const currentScrollLeft = carouselV5.scrollLeft;
    const cardWidth = cardsV5[0].offsetWidth + 24;
    const index = Math.round(currentScrollLeft / cardWidth);
    
    dotsV5.forEach((dot, i) => {
      if (i === index) dot.classList.add('active');
      else dot.classList.remove('active');
    });
  });

  dotsV5.forEach((dot) => {
    dot.addEventListener('click', () => {
      const index = parseInt(dot.getAttribute('data-index'));
      const cardWidth = cardsV5[0].offsetWidth + 24;
      carouselV5.scrollTo({ left: index * cardWidth, behavior: 'smooth' });
    });
  });
}

/* VALES V7 (Con persistencia en localStorage) */
function configurarVale(idItem, idImg1, idImg2, storageKey) {
  const item = document.getElementById(idItem);
  const img1 = document.getElementById(idImg1);
  const img2 = document.getElementById(idImg2);

  if (item && img1 && img2) {
    const seleccionadoGuardado = localStorage.getItem(storageKey);
    if (seleccionadoGuardado === 'true') {
      img1.classList.add('inactive');
      img2.classList.remove('inactive');
    }

    item.addEventListener('click', () => {
      item.classList.remove('bounce');
      void item.offsetWidth;
      item.classList.add('bounce');

      if (img1.classList.contains('inactive')) {
        img1.classList.remove('inactive');
        img2.classList.add('inactive');
        localStorage.setItem(storageKey, 'false');
      } else {
        img1.classList.add('inactive');
        img2.classList.remove('inactive');
        localStorage.setItem(storageKey, 'true');
      }
    });
  }
}

configurarVale('valeBeso', 'imgBeso1', 'imgBeso2', 'vale_beso_sel');
configurarVale('valeCine', 'imgCine1', 'imgCine2', 'vale_cine_sel');
configurarVale('valeComida', 'imgComida1', 'imgComida2', 'vale_comida_sel');
configurarVale('valeAbrazo', 'imgAbrazo1', 'imgAbrazo2', 'vale_abrazo_sel');
configurarVale('valeDeseo', 'imgDeseo1', 'imgDeseo2', 'vale_deseo_sel');

/* REPRODUCTOR V8 */
const playBtn = document.getElementById('playBtn');
const progressBar = document.getElementById('progressBar');
const progressIndicator = document.getElementById('progressIndicator');
const timeIndicator = document.getElementById('timeIndicator');

function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

if (audio) {
  audio.addEventListener('loadedmetadata', () => {
    timeIndicator.textContent = `00:00 · ${formatTime(audio.duration)}`;
  });

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      playIcon.className = 'icon-pause';
      playIcon.innerHTML = '<span></span><span></span>';
    } else {
      audio.pause();
      playIcon.className = 'icon-play';
      playIcon.innerHTML = '';
    }
  });

  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      const percentage = (audio.currentTime / audio.duration) * 100;
      progressIndicator.style.width = `${percentage}%`;
      timeIndicator.textContent = `${formatTime(audio.currentTime)} · ${formatTime(audio.duration)}`;
    }
  });

  progressBar.addEventListener('click', (e) => {
    const rect = progressBar.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pos * audio.duration;
  });

  audio.addEventListener('ended', () => {
    playIcon.className = 'icon-play';
    playIcon.innerHTML = '';
    audio.currentTime = 0;
  });
}

/* PASTEL V9 */
const cakeToggleArea = document.getElementById('cakeToggleArea');
const imgPastelOff = document.getElementById('imgPastelOff');
const imgPastelOn = document.getElementById('imgPastelOn');

if (cakeToggleArea && imgPastelOff && imgPastelOn) {
  cakeToggleArea.addEventListener('click', () => {
    if (imgPastelOn.classList.contains('inactive')) {
      imgPastelOn.classList.remove('inactive');
      imgPastelOff.classList.add('inactive');
    } else {
      imgPastelOn.classList.add('inactive');
      imgPastelOff.classList.remove('inactive');
    }
  });
}

/* REGALO V10 -> MUESTRA VISTA 11 AL HACER CLIC */
const giftToggleArea = document.getElementById('giftToggleArea');
const foto11 = document.getElementById('foto11');
const imgRegaloAbierto = document.getElementById('imgRegaloAbierto');
const vista11Recuerdo = document.getElementById('vista11-recuerdo');

if (giftToggleArea && foto11 && imgRegaloAbierto && vista11Recuerdo) {
  giftToggleArea.addEventListener('click', () => {
    foto11.classList.add('jump');
    setTimeout(() => foto11.classList.remove('jump'), 200);

    imgRegaloAbierto.classList.remove('inactive');
    foto11.classList.add('inactive');

    vista11Recuerdo.classList.remove('hidden');
    setTimeout(() => {
      vista11Recuerdo.scrollIntoView({ behavior: 'smooth' });
    }, 200);
  });
}

/* Modal y Descarga Automática Ajustada */
function abrirModalRecuerdo() {
  const modal = document.getElementById('modalImagenCompleta');
  const imgSrc = document.getElementById('imagenRecuerdoSrc').src;
  document.getElementById('imagenModalZoom').src = imgSrc;
  modal.style.display = 'flex';
}

function cerrarModalRecuerdo(event) {
  if (!event || event.target.id === 'modalImagenCompleta' || event.target.classList.contains('cerrar-modal')) {
    document.getElementById('modalImagenCompleta').style.display = 'none';
  }
}

async function descargarRecuerdo() {
  const imageUrl = document.getElementById('imagenRecuerdoSrc').src;
  const fileName = imageUrl.substring(imageUrl.lastIndexOf('/') + 1) || 'foto11.png';

  try {
    const response = await fetch(imageUrl);
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(blobUrl);
  } catch (error) {
    const a = document.createElement('a');
    a.href = imageUrl;
    a.target = '_blank';
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}

/* INTERSECTION OBSERVER */
function observeReveals() {
  const reveals = document.querySelectorAll('.reveal, #vista2, #vista3, #vista4, #vista5, #vista6, #vista7, #vista8, #vista9, #vista10, #vista11-recuerdo, #vista12');
  const observer = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.2 });

  reveals.forEach(sec => observer.observe(sec));
}
</script>
